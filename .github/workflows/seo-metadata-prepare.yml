name: Prepare verified SEO metadata
'on':
  push:
    branches:
    - seo-metadata-prepare-20261112
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
    - uses: actions/checkout@v4
      with:
        ref: 84e4f255fbd5e38ea7701afd65bcd41c6773229b
        fetch-depth: 1
    - name: Apply and verify approved metadata patch
      shell: bash
      run: "set -euo pipefail\nexpected=84e4f255fbd5e38ea7701afd65bcd41c6773229b\ntest \"$(git ls-remote origin refs/heads/main | cut -f1)\" = \"$expected\"\npython3 - <<'PYTHON'\nfrom pathlib import Path\nimport base64,hashlib,re,subprocess\np=Path('index.html')\nold=p.read_bytes()\nassert hashlib.sha256(old).hexdigest() == 'a9f6820deb9d0b98f1c6be1f20515cf1e3802f928d5ca7c83f7e9b34153aa735', 'Source changed'\npatch=base64.b64decode('')\nsubprocess.run(['git','apply','--check','-'],input=patch,check=True)\nsubprocess.run(['git','apply','-'],input=patch,check=True)\nnew=p.read_bytes()\nassert hashlib.sha256(new).hexdigest() == 'cf500cc60667fb0e25e0399784bfe2e85656e579d25c185eb7b5162e85f26105', 'Unexpected patch result'\nassert old[old.lower().index(b'<body'):] == new[new.lower().index(b'<body'):], 'Body changed'\nfor tag in [b'style',b'script']:\n    assert re.findall(b'<'+tag+br'\\b.*?</'+tag+b'>',old,re.S) == re.findall(b'<'+tag+br'\\b.*?</'+tag+b'>',new,re.S), 'Style/script changed'\nPYTHON\ngit diff --check\ntest \"$(git diff --name-only)\" = \"index.html\"\ngit config user.name 'github-actions[bot]'\ngit config user.email '41898282+github-actions[bot]@users.noreply.github.com'\ngit add -- index.html\ngit commit -m 'Add study guide search and sharing metadata'\ntest \"$(git ls-remote origin refs/heads/main | cut -f1)\" = \"$expected\"\ngit push origin HEAD:refs/heads/seo-metadata-candidate-20261112\n"
